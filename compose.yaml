services:
  greener-frontend:
    build: ./greener/frontend
    container_name: greener-frontend
    restart: unless-stopped
    working_dir: /usr/src/app
    ports:
      - "3000:5173"
    environment:
      - NODE_ENV=development   
    volumes:
      - ./greener/frontend:/usr/src/app
      - /usr/src/app/node_modules
     
  greener-postgres:
    image: postgres:15
    container_name: greener-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports: 
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  greener-backend:
    build: ./greener/backend
    container_name: greener-backend
    restart: unless-stopped
    working_dir: /usr/src/app
    ports:
      - "3001:3001"
    env_file:
      - .env
    environment:
      - NODE_ENV=development
      - PORT=3001 
    volumes:
      - ./greener/backend:/usr/src/app
      - /usr/src/app/node_modules
    depends_on:
      - greener-postgres

volumes:
  postgres_data:


networks:
  default:
    name: greener-network 